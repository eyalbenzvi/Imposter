name: Deploy to GitHub Pages

on:
  push:
    # Build and test on either branch; see the deploy job for why only one of
    # them can actually publish.
    branches:
      - main
      - claude/imposter-game-app-xajsxb
      - claude/multi-device-game-plan-lhg70n
  # Lets you publish the current branch by hand from the Actions tab.
  workflow_dispatch:

# Only the token permissions Pages actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a running deploy, but never cancels one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The word store is data, so it gets checked before anything ships.
      - name: Validate the word store
        run: npm run validate:words

      - name: Test the game logic
        run: npm test

      - run: npm run build

      # Requires Pages to already be switched on for the repository, under
      # Settings -> Pages -> Source: GitHub Actions. That is a one-time manual
      # step and cannot be automated from here: the action's `enablement: true`
      # input calls the create-Pages-site API, which GITHUB_TOKEN is not allowed
      # to do ("Resource not accessible by integration") no matter what
      # permissions the workflow requests, because creating a site needs
      # repository admin rather than `pages: write`.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    # Pages deployments are gated by the `github-pages` environment, which
    # GitHub creates permitting the DEFAULT branch only. A push from any other
    # branch has this job rejected before a runner is even assigned, which shows
    # up as a failed run even though the build was fine — red runs that mean
    # nothing are exactly what hides the ones that do.
    #
    # Comparing against the default branch instead of hard-coding a name means
    # the job is skipped cleanly (grey, run still green) rather than failing,
    # and it starts publishing from main the moment main is made the default,
    # with no edit here.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

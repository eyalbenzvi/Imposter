name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you publish the current branch by hand from the Actions tab.
  workflow_dispatch:

# Only the token permissions Pages actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a running deploy, but never cancels one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The word store is data, so it gets checked before anything ships.
      - name: Validate the word store
        run: npm run validate:words

      - name: Test the game logic
        run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

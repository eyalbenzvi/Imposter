name: Deploy to GitHub Pages

on:
  push:
    # Pages deployments are gated by the `github-pages` environment, which
    # GitHub creates allowing the DEFAULT branch only. This repository's default
    # branch is still claude/imposter-game-app-xajsxb, so a push to main builds
    # fine but has its deploy job rejected before a runner is even assigned.
    # Both are listed so publishing works today and keeps working the moment
    # main is made the default branch — at which point the second entry can go.
    branches: [main, claude/imposter-game-app-xajsxb]
  # Lets you publish the current branch by hand from the Actions tab.
  workflow_dispatch:

# Only the token permissions Pages actually needs.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes a running deploy, but never cancels one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The word store is data, so it gets checked before anything ships.
      - name: Validate the word store
        run: npm run validate:words

      - name: Test the game logic
        run: npm test

      - run: npm run build

      # Requires Pages to already be switched on for the repository, under
      # Settings -> Pages -> Source: GitHub Actions. That is a one-time manual
      # step and cannot be automated from here: the action's `enablement: true`
      # input calls the create-Pages-site API, which GITHUB_TOKEN is not allowed
      # to do ("Resource not accessible by integration") no matter what
      # permissions the workflow requests, because creating a site needs
      # repository admin rather than `pages: write`.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
